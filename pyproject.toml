[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quest-labeling"
version = "0.2.0.dev3"
description = "Reproducible multi-target transformer learning for Google QUEST"
authors = [{name = "Chia-Ta Tsai"}]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "scipy>=1.14,<2",
    "scikit-learn>=1.6,<2",
    "torch>=2.8,<3",
    "transformers>=5,<6",
    "safetensors>=0.6,<1",
    "sentencepiece>=0.2,<1",
    "threadpoolctl>=3.5,<4",
]

[project.urls]
Repository = "https://github.com/cttsai1985/kaggle-google-quest-solution"
Documentation = "https://github.com/cttsai1985/kaggle-google-quest-solution/tree/master/docs"

[project.scripts]
quest = "quest.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
lab = ["jupyterlab>=4,<5", "nbclient>=0.10,<1", "nbconvert>=7,<8", "matplotlib>=3.10,<4"]
data = ["kaggle>=2,<3"]
tracking = ["mlflow-skinny>=3,<4"]
serving = ["mlflow==3.18.0"]
tracking-test = ["sqlalchemy>=2,<3", "alembic>=1.15,<2"]

[tool.uv.sources]
torch = {index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build]
artifacts = ["src/quest/build-info.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/quest"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
